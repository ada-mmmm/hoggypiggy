name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build plugin
        run: cargo build --release

      - name: Package bundle
        shell: pwsh
        run: ./package.ps1 -Out dist

      - name: Stage installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item Install-HogSpasm.bat dist/Install-HogSpasm.bat -Force

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HogSpasm.vst3.zip
            dist/Install-HogSpasm.bat
          fail_on_unmatched_files: true
