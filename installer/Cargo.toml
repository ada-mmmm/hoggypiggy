[package]
name = "hog_installer"
version = "1.0.0"
edition = "2021"
description = "Downloads and installs the latest HogSpasm release from GitHub"

[dependencies]
ureq = { version = "2.10", default-features = false, features = ["tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
